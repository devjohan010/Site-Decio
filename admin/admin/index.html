<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel Administrativo | EE Décio Ferraz Alvim</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f3f6fa;
        color: #202b32;
      }

      .admin-header {
        background: #082d62;
        color: white;
        padding: 20px 30px;
      }

      .admin-header h1 {
        font-size: 24px;
      }

      .admin-header p {
        margin-top: 5px;
        opacity: 0.8;
      }

      .admin-container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .admin-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      .admin-top h2 {
        color: #082d62;
      }

      .btn-nova {
        border: none;
        background: #176cb0;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }

      .btn-nova:hover {
        background: #104b87;
      }

      .noticias-container {
        display: grid;
        gap: 20px;
      }

      .noticia-card {
        background: white;
        border: 1px solid #d9e3ed;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 5px 20px rgba(8, 45, 98, 0.06);
      }

      .noticia-card h3 {
        color: #082d62;
        margin-bottom: 10px;
      }

      .noticia-card p {
        color: #52616d;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .acoes {
        display: flex;
        gap: 10px;
      }

      .btn {
        border: none;
        padding: 9px 15px;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
      }

      .btn-editar {
        background: #d8aa2e;
        color: white;
      }

      .btn-excluir {
        background: #c0392b;
        color: white;
      }

      .vazia {
        background: white;
        padding: 40px;
        text-align: center;
        border-radius: 12px;
        border: 1px solid #d9e3ed;
        color: #52616d;
      }

      @media (max-width: 600px) {
        .admin-top {
          flex-direction: column;
          align-items: stretch;
        }

        .btn-nova {
          width: 100%;
        }
      }
      .formulario-noticia {
        background: white;
        border: 1px solid #d9e3ed;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 5px 20px rgba(8, 45, 98, 0.06);
      }

      .formulario-noticia h2 {
        color: #082d62;
        margin-bottom: 20px;
      }

      .formulario-noticia form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .formulario-noticia label {
        font-weight: bold;
        color: #202b32;
        margin-top: 5px;
      }

      .formulario-noticia input,
      .formulario-noticia textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d9e3ed;
        border-radius: 8px;
        font: inherit;
        outline: none;
      }

      .formulario-noticia input:focus,
      .formulario-noticia textarea:focus {
        border-color: #176cb0;
      }

      .form-acoes {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 10px;
      }

      .btn-publicar {
        background: #176cb0;
        color: white;
      }
    </style>
  </head>

  <body>
    <header class="admin-header">
      <h1>Painel Administrativo</h1>
      <p>EE Professor Dr. Décio Ferraz Alvim</p>
    </header>

    <main class="admin-container">
      <div class="admin-top">
        <h2>Notícias</h2>

        <button class="btn-nova">+ Nova notícia</button>
      </div>

      <div id="formulario-noticia" class="formulario-noticia" hidden>
        <h2>Nova notícia</h2>

        <form id="form-noticia">
          <label for="titulo"> Título </label>

          <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Digite o título da notícia"
            required
          />

          <label for="conteudo"> Conteúdo </label>

          <textarea
            id="conteudo"
            name="conteudo"
            rows="6"
            placeholder="Digite o conteúdo da notícia"
            required
          ></textarea>

          <div class="form-acoes">
            <button type="button" id="cancelar-noticia" class="btn">
              Cancelar
            </button>

            <button type="submit" class="btn btn-publicar">
              Publicar notícia
            </button>
          </div>
        </form>
      </div>
      <div class="noticias-container"></div>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
